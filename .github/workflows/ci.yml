name: CI

on:
  push:
    branches:
      - main
      - hotfix/*
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Verify third-party licenses
        run: |
          pnpm generate-licenses
          if [ -n "$(git status --porcelain -- THIRD_PARTY_LICENSES.txt)" ]; then
            echo "::error::THIRD_PARTY_LICENSES.txt is missing or out of date. Run 'pnpm generate-licenses' and commit the result."
            exit 1
          fi

      - name: Build
        run: pnpm build

  test:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  e2e-linux:
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm build

      - name: Install Electron system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libasound2t64 libnss3 libxss1

      - name: Cache E2E artifacts
        uses: actions/cache@v6
        with:
          path: e2e-tests/cache
          key: e2e-cache-${{ runner.os }}-${{ hashFiles('e2e-tests/global-setup.ts', 'e2e-tests/setup/**', 'e2e-tests/versions.ts') }}

      # DEBUG (revert): reproduce the Linux external-note failure with a full event
      # log; 10 runs on 4 workers, so instances compete the way the suite does
      - name: "Debug: external note auto-extraction x10, 1.14.4"
        continue-on-error: true
        env:
          E2E_DEBUG_LATEST: "1.14.4"
        run: xvfb-run --auto-servernum pnpm test:e2e e2e-tests/specs/external-files.spec.ts -g "auto-extraction" --repeat-each=10 --retries=0 --output=e2e-tests/debug-results/1.14.4

      - name: "Debug: external note auto-extraction x10, 1.15.1"
        continue-on-error: true
        run: xvfb-run --auto-servernum pnpm test:e2e e2e-tests/specs/external-files.spec.ts -g "auto-extraction" --repeat-each=10 --retries=0 --output=e2e-tests/debug-results/1.15.1

      - name: Run E2E tests
        run: xvfb-run --auto-servernum pnpm test:e2e

      - name: Upload E2E test results
        # DEBUG (revert): back to if: failure() and only e2e-tests/test-results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results-${{ github.job }}
          path: |
            e2e-tests/test-results
            e2e-tests/debug-results
          retention-days: 7

  e2e-linux-all:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/hotfix/'))
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm build

      - name: Install Electron system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libasound2t64 libnss3 libxss1

      - name: Cache E2E artifacts
        uses: actions/cache@v6
        with:
          path: e2e-tests/cache
          key: e2e-cache-${{ runner.os }}-all-${{ hashFiles('e2e-tests/global-setup.ts', 'e2e-tests/setup/**', 'e2e-tests/versions.ts') }}

      - name: Run E2E tests (all versions)
        run: xvfb-run --auto-servernum pnpm test:e2e:all

      - name: Upload E2E test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results-${{ github.job }}
          path: e2e-tests/test-results
          retention-days: 7

  e2e-macos:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/hotfix/'))
    needs: checks
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm build

      - name: Cache E2E artifacts
        uses: actions/cache@v6
        with:
          path: e2e-tests/cache
          key: e2e-cache-${{ runner.os }}-${{ hashFiles('e2e-tests/global-setup.ts', 'e2e-tests/setup/**', 'e2e-tests/versions.ts') }}

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload E2E test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results-${{ github.job }}
          path: e2e-tests/test-results
          retention-days: 7

  e2e-windows:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/hotfix/'))
    needs: checks
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm build

      - name: Cache E2E artifacts
        uses: actions/cache@v6
        with:
          path: e2e-tests/cache
          key: e2e-cache-${{ runner.os }}-${{ hashFiles('e2e-tests/global-setup.ts', 'e2e-tests/setup/**', 'e2e-tests/versions.ts') }}

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload E2E test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results-${{ github.job }}
          path: e2e-tests/test-results
          retention-days: 7
