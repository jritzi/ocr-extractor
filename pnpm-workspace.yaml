packages:
  - "ocr-extractor-api"

minimumReleaseAge: 2880
blockExoticSubdeps: true
trustPolicy: no-downgrade

# https://github.com/pnpm/pnpm/issues/10622
trustPolicyExclude:
  - semver

peerDependencyRules:
  allowedVersions:
    eslint-plugin-obsidianmd>obsidian: ">=1.8.7"

allowBuilds:
  electron: true
  esbuild: true
  tesseract.js: true
overrides:
  brace-expansion@1: ^1.1.13
  brace-expansion@2: ^2.0.3
  brace-expansion@5: ^5.0.6
  yaml@2: ^2.8.3
tagVersionPrefix: ""
gitTagVersion: false
